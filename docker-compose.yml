services:
  ollama:
    image: ollama/ollama:latest
    ports:
      # Host port 11435 avoids conflict with native Ollama (which uses 11434).
      # Inside Docker the container still listens on 11434 — backend reaches it
      # via the Docker network at ollama:11434 with no host port involved.
      - "11435:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  backend:
    build:
      context: ./app/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - journal-data:/app/data
      - .env:/app/.env
    env_file:
      - .env
    environment:
      # Always use the Docker-internal address — works whether or not
      # the user also has a native Ollama running on the host.
      - OLLAMA_BASE_URL=http://ollama:11434
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTPS_PROXY:-}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./app/frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=http://localhost:8000/api
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  journal-data:
  ollama-data:
